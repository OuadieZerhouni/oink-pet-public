# What the screenshot pipeline captures and how each slide is captioned.
# `screenshots.py` builds the app once per slide with that slide's `defines`,
# captures the simulator, composes with the caption, resizes to Apple's sizes,
# and verifies every output dimension. Captions and order: ASO.md § Screenshots.
#
# Each slide is a DEBUG_MARKETING_SCENE (lib/core/marketing_scene.dart): the real
# app booted into one pose, with synthesised touches through the real gestures.

# [width, height] — compose reads them in that order. Portrait iPhone only.
sizes:
  "6.9": [1320, 2868]   # iPhone 17 Pro Max class
  "6.5": [1242, 2688]   # legacy slot

device: "iPhone 17 Pro Max"
status_bar: {time: "9:41", battery: 100, cellular: 4, wifi: 3}

style:
  background: [255, 223, 233]   # soft piglet pink
  text: [94, 35, 64]            # the app's ink maroon
  accent: [232, 92, 138]

slides:
  - id: home
    defines: {DEBUG_MARKETING_SCENE: home}
    caption:
      en: "Your own baby piglet"
  - id: love
    defines: {DEBUG_MARKETING_SCENE: love}
    caption:
      en: "Belly rubs = giggles"
  - id: bath
    defines: {DEBUG_MARKETING_SCENE: bath}
    caption:
      en: "Bubble bath time!"
  - id: feed
    defines: {DEBUG_MARKETING_SCENE: feed}
    caption:
      en: "Snack time, yum!"
  - id: closet
    defines: {DEBUG_MARKETING_SCENE: closet}
    caption:
      en: "Dress it up"
  - id: game
    defines: {DEBUG_MARKETING_SCENE: game}
    settle: 11            # seconds after launch: mid-round, items falling
    caption:
      en: "Catch apples & acorns"
