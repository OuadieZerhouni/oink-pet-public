# GENERATED by app-factory 1652235 from app.yaml — do not hand-edit.
# Run `scaffold.py --regen ci` after changing app.yaml.
#
# The script ORDER below is load-bearing. It was arrived at by failing CI
# repeatedly on OuO, and each comment records what breaks if you reorder.
#
# The App Store Connect key is NOT in this file or this repo. It lives as a
# named integration in Codemagic's own settings, shared by every app the
# factory builds — `integrations.app_store_connect` references it by name.

workflows:

  testFlight:
    name: Oink
    max_build_duration: 120
    integrations:
      app_store_connect: OUADIE ZERHOUNI
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        # The PRIMARY app id only. A widget extension is a second signed
        # binary; its profile is fetched explicitly in the signing step below,
        # which is unambiguously valid regardless of whether this field accepts
        # a list. `xcode-project use-profiles` then applies both.
        bundle_identifier: com.ouadieZerhouni.oinkPet
      vars:
        # Debug seams stay OFF in CI. A build that ships with DEBUG_PRO_MODE on
        # would hand every reviewer a free unlocked app.
        BUILD_FLAGS: ""

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate localizations
        # Explicit rather than relying on the build to trigger it: a stale
        # app_localizations.dart compiles fine and silently serves last week's
        # strings.
        script: flutter gen-l10n

      - name: Verify the manifest has not drifted
        # The cheapest possible failure point. If the App Group id or the
        # locale list has been hand-edited out of agreement with app.yaml, fail
        # here in seconds rather than shipping an app whose widget cannot talk
        # to it or whose translations the OS will not select.
        script: flutter test test/manifest_sync_test.dart

      - name: Analyze and test
        script: |
          flutter analyze
          flutter test

      - name: Install iOS Pods
        # `rm -f Podfile.lock` + `--repo-update`: CI starts from a clean
        # checkout, and a lock file pinned to a spec repo state the machine
        # does not have fails in a way that reads like a dependency conflict.
        script: |
          cd ios
          rm -f Podfile.lock
          pod repo update
          pod install --repo-update
          cd ..

      # --- widget extension (emitted only when features.widget is true) ---
      # Must run AFTER pod install, so it edits the final project, and BEFORE
      # `use-profiles`, so signing sees the new target's bundle id. The Ruby
      # script is idempotent, so re-runs are safe.

      - name: Set up code signing
        script: |
          # The primary app id's files come from the ios_signing block above.
          # A widget extension is a separate binary and must be fetched by id.
          # Printing the profile directory is a diagnostic that has earned its
          # place: "no matching profiles" is otherwise indistinguishable from
          # "profile fetched but not applied".
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          xcode-project use-profiles --verbose

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        # Uploaded to TestFlight, never auto-submitted for review: a human
        # decides when a build faces App Review.
        submit_to_testflight: true
      email:
        recipients: []
        notify:
          success: true
          failure: true
